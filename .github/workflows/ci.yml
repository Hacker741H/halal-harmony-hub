name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show runner versions
        run: |
          node --version
          npm --version
      - name: Use pinned npm
        run: |
          npm install --global npm@11.16.0
          npm --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
